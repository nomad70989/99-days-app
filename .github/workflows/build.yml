# 99 DAYS IN THE SAHARA - builds the real iPhone / iPad app on a free cloud Mac.
# It takes the game from your itch.io page, builds the app and offers it for download:
# open the finished run (Actions tab) and download "iphone-app" at the bottom.
# Inside is NinetyNineDays.ipa - install it on the iPhone with Sideloadly (Windows).
name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      game_url:
        description: "itch.io game folder (where index.pck lives)"
        required: false
        default: "https://html-classic.itch.zone/html/19498163/"

env:
  GODOT_VERSION: "4.7.2"
  APP: NinetyNineDays
  BUNDLE_ID: com.nomadsmoker.ninetyninedays
  GAME_URL: ${{ github.event.inputs.game_url || 'https://html-classic.itch.zone/html/19498163/' }}

jobs:
  ios:
    runs-on: macos-26
    defaults:
      run:
        shell: bash -eo pipefail {0}
    timeout-minutes: 60
    steps:
      - name: Use the newest Xcode (Godot 4.7 needs the iOS 26 SDK)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Unpack the Xcode project (made with Godot's iOS export)
