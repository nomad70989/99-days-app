      - name: Get Godot's iOS engine (official Godot release)
        run: |
          set -e
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          curl -sSL --retry 3 -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/ios.zip -d .
          rm templates.tpz
          unzip -q ios.zip 'libgodot.ios.release.xcframework/*' 'MoltenVK.xcframework/*' 'godot_apple_embedded/Images.xcassets/SplashImage.imageset/*' -d tpl
          rm ios.zip
          mv tpl/libgodot.ios.release.xcframework ${APP}.xcframework
          mv tpl/MoltenVK.xcframework MoltenVK.xcframework
          cp tpl/godot_apple_embedded/Images.xcassets/SplashImage.imageset/*.png ${APP}/Images.xcassets/SplashImage.imageset/
          rm -rf tpl
          find ${APP}.xcframework MoltenVK.xcframework -name empty -delete
          ls ${APP}.xcframework

      - name: Get the game from itch.io
        run: |
          set -e
          REF="${GAME_URL}index.html"
          curl -sSL --retry 3 -H "Referer: $REF" -A "Mozilla/5.0" -o web.pck "${GAME_URL}index.pck"
          curl -sSL --retry 3 -H "Referer: $REF" -A "Mozilla/5.0" -o icon512.png "${GAME_URL}index.512x512.png"
          ls -la web.pck icon512.png
          test $(stat -f%z web.pck) -gt 1000000
          # same game, with the phone settings (native Metal graphics) instead of the web ones
          python3 pck_swap.py web.pck ${APP}.pck project.binary ios_project.binary
          rm web.pck
          # app icons in all sizes
          cd ${APP}/Images.xcassets/AppIcon.appiconset
          for f in $(python3 -c "import json; print(' '.join(i['filename'] for i in json.load(open('Contents.json'))['images']))"); do
            px=$(echo "$f" | sed -E 's/Icon-([0-9]+).*/\1/')
            sips -s format png -z $px $px ../../../icon512.png --out "$f" > /dev/null
          done
          ls

      - name: Build the app (unsigned) and pack the .ipa
        run: |
          set -e
          xcodebuild -project ${APP}.xcodeproj -scheme ${APP} -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tail -30
          APPDIR=dd/Build/Products/Release-iphoneos/${APP}.app
          test -f "$APPDIR/${APP}"   # the app program itself must exist
          mkdir -p Payload
          cp -R "$APPDIR" Payload/
          zip -qry ${APP}.ipa Payload
          ls -la ${APP}.ipa

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: iphone-app
          path: NinetyNineDays.ipa
          retention-days: 30

      - name: Test - start the app in the iPhone simulator
        continue-on-error: true
        run: |
          xcodebuild -project ${APP}.xcodeproj -scheme ${APP} -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ddsim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -15
          SIMAPP=ddsim/Build/Products/Release-iphonesimulator/${APP}.app
          DEV=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-9]" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "simulator: $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$SIMAPP"
          xcrun simctl launch --console-pty "$DEV" ${BUNDLE_ID} > sim_console.log 2>&1 &
          mkdir -p shots
          for t in 25 50 90; do sleep 25; xcrun simctl io "$DEV" screenshot shots/shot_${t}s.png || true; done
          xcrun simctl spawn "$DEV" log show --last 5m --predicate 'process == "NinetyNineDays"' --style compact > sim_log.txt 2>&1 || true
          tail -60 sim_console.log || true

      - name: Upload the simulator test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test
          path: |
            shots/
            sim_console.log
            sim_log.txt
          retention-days: 14
